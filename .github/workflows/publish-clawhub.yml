name: Publish skills to ClawHub

# This is a release.yml implementation detail, not an independent publisher.
# PRs that edit this file run secretless validation only. The authenticated job
# can run only as a reusable job after release.yml has passed its quality gate,
# created the annotated tag, and staged a draft GitHub Release.
# story and browser-cdp are published manually and excluded here.
on:
  pull_request:
    paths: ['.github/workflows/publish-clawhub.yml']
  workflow_call:
    inputs:
      target_sha:
        description: Exact vetted release commit to publish from
        required: true
        type: string
      release_tag:
        description: Validated vX.Y.Z release tag
        required: true
        type: string
      bump:
        description: Version bump for changed skills
        required: true
        type: string
      changelog:
        description: Changelog text (optional; defaults to the release tag)
        required: false
        type: string
        default: ''
    secrets:
      CLAWHUB_TOKEN:
        description: ClawHub API token; required only when release.yml enables publishing
        required: true

# Never let two orchestrated ClawHub publishes race.
concurrency:
  group: clawhub-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Current clawhub declares engines.node >=22.
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ClawHub CLI
        run: npm install -g clawhub
      - name: Validate secretless PR surface
        run: |
          clawhub --help >/dev/null
          bash scripts/check-openclaw-skills.sh

  publish:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the canonical release orchestrator context
        env:
          EXPECTED_REPOSITORY: qin1473692580-ux/oh-story-claudecode
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Authenticated ClawHub publishing is limited to $EXPECTED_REPOSITORY."
            exit 1
          fi

      - name: Check out the vetted release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the reusable-workflow inputs
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD^{commit})" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout does not match the vetted release SHA."
            exit 1
          fi
          case "$BUMP" in patch|minor|major) ;; *)
            echo "::error::Invalid ClawHub bump '$BUMP'."
            exit 1
          esac
          python3 scripts/manage-version.py check --tag "$RELEASE_TAG" --require-changelog

      - uses: actions/setup-node@v4
        with:
          # Current clawhub declares engines.node >=22.
          node-version: 24

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Authenticate
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          clawhub whoami

      - name: Exclude manually-managed skills
        # Affects only this ephemeral CI checkout, never your repo.
        # `sync` scans the skills/ dir, so removing these folders excludes them.
        run: |
          for s in story browser-cdp; do rm -rf "skills/$s"; done

      - name: Resolve changelog text
        env:
          REQUESTED_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$REQUESTED_CHANGELOG" ]; then
            REQUESTED_CHANGELOG="Synced from oh-story $RELEASE_TAG"
          fi
          {
            echo 'CLAWHUB_CHANGELOG<<EOF'
            echo "$REQUESTED_CHANGELOG"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Show what would publish
        env:
          BUMP: ${{ inputs.bump }}
        run: clawhub --no-input sync --dry-run --bump "$BUMP"

      - name: Publish changed skills
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          clawhub --no-input sync --all \
            --bump "$BUMP" \
            --changelog "$CLAWHUB_CHANGELOG"
